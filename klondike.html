<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klondike Solitaire · 纸牌</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="fc-wrap">
    <div class="fc-page kd-page">
      <div class="fc-frame">
        <div class="fc-top kd-top">
          <div class="kd-stock-wrap">
            <div class="kd-stock" id="kd-stock">
              <img id="kd-stock-icon" class="kd-stock-icon" src="texture/blackcastling.png" alt="" draggable="false">
            </div>
            <div class="kd-waste" id="kd-waste"></div>
          </div>
          <div class="fc-cells fc-foundations" id="fc-foundations"></div>
        </div>
        <div class="fc-table kd-table" id="fc-table"></div>
        <div id="fc-timer" class="fc-timer">0s</div>
        <div id="kd-min-moves" class="kd-min-moves"></div>
        <div class="fc-foot">
          <button id="btn-fc-new" class="btn">重新开始</button>
          <button id="btn-fc-settings" class="btn">设置</button>
          <button id="btn-fc-home" class="btn">返回主界面</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- 设置弹窗（复用设置页样式） -->
  <div id="fc-settings-modal" class="modal hidden">
    <div class="settings-page">
      <button id="btn-fc-settings-back" class="start-join-btn" type="button">返回</button>
      <div class="settings-frame">
        <div class="settings-scroll">
          <div class="settings-body" id="fc-settings-body">
            <p class="fc-set-label">游戏设置(新局生效)</p>
            <hr class="setting-divider">
            <div class="setting-row toggle-row">
              <span class="setting-label">空列仅允许放置K或最下方为K的牌组</span>
              <button type="button" class="toggle" id="opt-empty-col-k"><img src="texture/toggleon.png" alt="on"></button>
            </div>
            <div class="setting-row toggle-row">
              <span class="setting-label">允许观战</span>
              <button type="button" class="toggle" id="opt-allow-spec"><img src="texture/toggleoff.png" alt="off"></button>
            </div>
            <div class="setting-row toggle-row">
              <span class="setting-label">设为开放</span>
              <button type="button" class="toggle" id="opt-open"><img src="texture/toggleoff.png" alt="off"></button>
            </div>
            <div class="setting-row toggle-row">
              <span class="setting-label">计时</span>
              <button type="button" class="toggle" id="opt-timer"><img src="texture/toggleoff.png" alt="off"></button>
            </div>
            <div class="setting-row">
              <span class="setting-label">当前有 <span id="fc-spec-count">0</span> 人观战</span>
            </div>
            <p class="fc-set-label">界面设置(即时生效)</p>
            <hr class="setting-divider">
            <div class="setting-row slider-row">
              <span class="setting-label">窗口缩放</span>
              <span id="fc-win-scale-label" class="setting-value">100%</span>
              <input id="fc-win-scale" type="range" min="40" max="200" step="5" value="100">
            </div>
            <div class="setting-row toggle-row">
              <span class="setting-label">显示最短步数</span>
              <button type="button" class="toggle" id="opt-show-min-moves"><img src="texture/toggleon.png" alt="on"></button>
            </div>
            <div class="setting-row toggle-row">
              <span class="setting-label">双击自动置入置牌位</span>
              <button type="button" class="toggle" id="opt-dbl-cascade"><img src="texture/toggleoff.png" alt="off"></button>
            </div>
            <div class="setting-row toggle-row">
              <span class="setting-label">牌面透明</span>
              <button type="button" class="toggle" id="opt-transparent"><img src="texture/toggleoff.png" alt="off"></button>
            </div>
            <div class="setting-row toggle-row">
              <span class="setting-label">边框提示花色</span>
              <button type="button" class="toggle" id="opt-suit-border"><img src="texture/toggleoff.png" alt="off"></button>
            </div>
            <div class="setting-row toggle-row">
              <span class="setting-label">双色模式</span>
              <button type="button" class="toggle" id="opt-two-color"><img src="texture/toggleoff.png" alt="off"></button>
            </div>
          </div>
          <div class="settings-scrollbar" id="fc-settings-scrollbar">
            <div class="settings-scrollbar-thumb" id="fc-settings-scrollbar-thumb"></div>
          </div>
        </div>
        <div class="settings-foot">
          <button id="btn-fc-view-code" class="btn">查看房间码</button>
          <button id="btn-fc-settings-apply" class="btn">应用</button>
          <button id="btn-fc-settings-default" class="btn">设为默认</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 房间码（邀请码界面，类似 chess 等待对手弹窗） -->
  <div id="fc-code-modal" class="modal hidden">
    <div class="confirm-page">
      <div class="confirm-frame">
        <div class="confirm-title">房间码</div>
        <div class="confirm-body">
          <input id="fc-code-input" class="wait-id" type="text" readonly value="—">
          <p class="confirm-text wait-tip">将你的房间码发送给对方</p>
        </div>
        <div class="confirm-foot">
          <button id="btn-fc-copy-id" class="btn">复制房间码</button>
          <button id="btn-fc-copy-link" class="btn">复制加入链接</button>
          <button id="btn-fc-code-back" class="btn">返回</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 观战退出提示 -->
  <div id="fc-exit-modal" class="modal hidden">
    <div class="confirm-page">
      <div class="confirm-frame">
        <div class="confirm-title">提示</div>
        <div class="confirm-body">
          <p id="fc-exit-text" class="confirm-text"></p>
        </div>
        <div class="confirm-foot">
          <button id="btn-fc-exit-ok" class="btn">返回主界面</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 重新开始选择弹窗 -->
  <div id="fc-restart-modal" class="modal hidden">
    <div class="confirm-page">
      <div class="confirm-frame">
        <div class="confirm-title">重新开始</div>
        <div class="confirm-body">
          <p class="confirm-text">开始新局（换一副新牌）<br>还是重玩这一局（同一副牌重来）？</p>
        </div>
        <div class="confirm-foot">
          <button id="btn-fc-restart-new" class="btn">开始新局</button>
          <button id="btn-fc-restart-replay" class="btn">重玩这一局</button>
          <button id="btn-fc-restart-cancel" class="btn">取消</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 通关弹窗（复用提示框样式） -->
  <div id="fc-win-modal" class="modal hidden">
    <div class="confirm-page">
      <div class="confirm-frame">
        <div class="confirm-title">恭喜通关！</div>
        <div class="confirm-body">
          <p id="fc-win-text" class="confirm-text">已将全部牌移到置牌位</p>
        </div>
        <div class="confirm-foot">
          <button id="btn-fc-win-new" class="btn">重新开始</button>
          <button id="btn-fc-win-home" class="btn">返回主界面</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="js/net.js"></script>
  <script src="js/profile.js"></script>
  <script src="banks/bank_001.js"></script>
  <script src="banks/bank_002.js"></script>
  <script src="banks/bank_003.js"></script>
  <script src="banks/bank_004.js"></script>
  <script src="banks/bank_005.js"></script>
  <script src="banks/bank_006.js"></script>
  <script src="banks/bank_007.js"></script>
  <script src="banks/bank_008.js"></script>
  <script src="banks/bank_009.js"></script>
  <script src="banks/bank_010.js"></script>
  <script src="js/klondike.js"></script>
  <!-- 消息提示层 -->
  <div id="chat-layer" class="chat-layer"></div>

</body>
</html>
