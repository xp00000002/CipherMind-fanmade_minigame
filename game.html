<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>国际象棋 · 对局</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="chess-pre-game">
  <div class="game-layout">
    <aside class="panel left">
      <div class="player-card" id="player-top"></div>
      <div class="status-box">
        <div id="status" class="status">准备中…</div>
      </div>
      <div class="controls">
        <button id="btn-undo" class="btn">悔棋</button>
        <button id="btn-draw" class="btn">求和</button>
        <button id="btn-rematch" class="btn">再来一局</button>
        <button id="btn-resign" class="btn btn-danger">认输</button>
        <button id="btn-settings" class="btn">设置</button>
      </div>
      <div class="conn-line">
        <span id="conn-state-label" class="conn-state-label">连接状态：</span>
        <span id="conn-state" class="conn-state">初始化…</span>
        <span id="spec-count" class="spec-count hidden"></span>
      </div>
    </aside>

    <main class="board-area">
      <div class="board-wrap">
        <div id="board" class="board"></div>
      </div>
    </main>

    <aside class="panel right">
      <div class="player-card" id="player-bottom"></div>
      <div class="moves-box">
        <div class="moves-head">
          <h3>棋谱</h3>
          <button id="btn-back-current" class="btn btn-sm hidden">回到当前</button>
        </div>
        <div id="moves" class="moves"></div>
      </div>
      <button id="btn-copy-moves" class="btn hidden">复制棋谱</button>
      <button id="btn-chat" class="btn">发送消息</button>
      <button id="btn-home" class="btn hidden">返回主界面</button>
    </aside>

    <!-- 平板端布局容器（JS 按断点重组 DOM，PC/手机端隐藏） -->
    <div class="top-panel"></div>
    <div class="bottom-panel">
      <div class="bottom-right"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- 消息提示层（右上角，新消息在上） -->
  <div id="chat-layer" class="chat-layer"></div>

  <!-- 发送消息 -->
  <div id="chat-modal" class="modal hidden">
    <div class="confirm-page">
      <div class="confirm-frame">
        <div class="confirm-title">发送消息</div>
        <div class="chat-body">
          <div class="chat-players" id="chat-players"></div>
          <div class="chat-right">
            <div class="chat-preset">
              <div id="chat-op-theme" class="chat-options"></div>
              <div id="chat-op-2" class="chat-options"></div>
              <div id="chat-op-3" class="chat-options"></div>
              <div id="chat-op-4" class="chat-options"></div>
              <div id="chat-op-5" class="chat-options"></div>
            </div>
            <div class="chat-custom">
              <input id="chat-input" class="join-input" type="text" placeholder="自定义消息（1-60字，中文算2字）" spellcheck="false" autocomplete="off" maxlength="120">
            </div>
          </div>
        </div>
        <div class="confirm-foot">
          <button id="chat-cancel" class="btn">取消</button>
          <button id="chat-send" class="btn">发送</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 等待界面（房间成员） -->
  <div id="wait-modal" class="modal hidden">
    <div class="confirm-page">
      <div class="zjh-wait-head">
        <button id="btn-open-room" class="start-join-btn" type="button">开放</button>
        <div class="zjh-wait-right">
          <button id="btn-room-code" class="start-join-btn" type="button">房间号码</button>
          <button id="btn-copy-link" class="start-join-btn" type="button">复制邀请链接</button>
        </div>
      </div>
      <div class="confirm-frame">
        <div class="zjh-wait-body" id="wait-body"></div>
        <div class="confirm-foot">
          <button id="btn-wait-back" class="btn">返回</button>
          <button id="btn-start-game" class="btn">开始游戏</button>
          <button id="btn-ready" class="btn hidden">准备</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 创建房间设置页（房主开局规则，创建房间前设定） -->
  <div id="create-modal" class="modal hidden">
    <div class="settings-page">
      <div class="settings-frame">
        <div class="settings-scroll">
          <div class="settings-body" id="create-body">
            <div class="setting-row toggle-row">
              <span class="setting-label">限制每步时间</span>
              <button type="button" class="toggle" id="rule-time-limit"><img src="texture/toggleoff.png" alt="off"></button>
            </div>
            <div class="setting-row slider-row">
              <span class="setting-label">每步时间（秒）</span>
              <input type="number" id="rule-time-sec" min="3" max="3600" value="30" class="num-input">
            </div>
            <div class="setting-row toggle-row">
              <span class="setting-label">禁用王车易位</span>
              <button type="button" class="toggle" id="rule-no-castle"><img src="texture/toggleoff.png" alt="off"></button>
            </div>
            <div class="setting-row toggle-row">
              <span class="setting-label">禁用底线升变</span>
              <button type="button" class="toggle" id="rule-no-promo"><img src="texture/toggleoff.png" alt="off"></button>
            </div>
            <div class="setting-row toggle-row">
              <span class="setting-label">禁用悔棋</span>
              <button type="button" class="toggle" id="rule-no-undo"><img src="texture/toggleoff.png" alt="off"></button>
            </div>
            <div class="setting-row toggle-row">
              <span class="setting-label">允许观战</span>
              <button type="button" class="toggle" id="rule-allow-spec"><img src="texture/toggleoff.png" alt="off"></button>
            </div>
            <div class="setting-row toggle-row">
              <span class="setting-label">禁用发送消息</span>
              <button type="button" class="toggle" id="rule-no-chat"><img src="texture/toggleoff.png" alt="off"></button>
            </div>
            <div class="setting-row toggle-row">
              <span class="setting-label">允许私聊</span>
              <button type="button" class="toggle" id="rule-private-chat"><img src="texture/toggleoff.png" alt="off"></button>
            </div>
          </div>
          <div class="settings-scrollbar" id="create-scrollbar">
            <div class="settings-scrollbar-thumb" id="create-scrollbar-thumb"></div>
          </div>
        </div>
        <div class="settings-foot">
          <button id="btn-create-back" class="btn">返回</button>
          <button id="btn-create-room" class="btn">创建房间</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 升变选择（提示类弹窗） -->
  <div id="promo-modal" class="modal hidden">
    <div class="confirm-page">
      <div class="confirm-frame">
        <div class="confirm-title">选择升变棋子</div>
        <div class="confirm-body">
          <div id="promo-options" class="promo-options"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 通用确认框（提示弹窗） -->
  <div id="confirm-modal" class="modal hidden">
    <div class="confirm-page">
      <div class="confirm-frame">
        <div class="confirm-title" id="confirm-title">提示</div>
        <div class="confirm-body">
          <p id="confirm-text" class="confirm-text">确定吗？</p>
        </div>
        <div class="confirm-foot">
          <button id="confirm-yes" class="btn">确定</button>
          <button id="confirm-no" class="btn">取消</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 设置 -->
  <div id="settings-modal" class="modal hidden">
    <div class="settings-page">
      <button id="btn-settings-close" class="start-join-btn" type="button">返回</button>
      <div class="settings-frame">
        <div class="settings-scroll">
          <div class="settings-body" id="settings-body">
            <div class="setting-row slider-row">
              <span class="setting-label">棋盘大小</span>
              <span id="board-scale-label" class="setting-value">100%</span>
              <input id="board-scale" type="range" min="40" max="200" step="5" value="100">
            </div>
            <div class="setting-row slider-row">
              <span class="setting-label">面板缩放</span>
              <span id="panel-scale-label" class="setting-value">100%</span>
              <input id="panel-scale" type="range" min="50" max="150" step="5" value="100">
            </div>
            <hr class="setting-divider">
            <div class="setting-row toggle-row">
              <span class="setting-label">反转棋盘朝向</span>
              <button type="button" class="toggle" id="opt-flip"><img src="texture/toggleoff.png" alt="off"></button>
            </div>
            <div class="setting-row toggle-row">
              <span class="setting-label">显示可走点</span>
              <button type="button" class="toggle" id="opt-moves"><img src="texture/toggleoff.png" alt="off"></button>
            </div>
            <div class="setting-row toggle-row">
              <span class="setting-label">隐藏消息提示</span>
              <button type="button" class="toggle" id="opt-hide-chat"><img src="texture/toggleoff.png" alt="off"></button>
            </div>
            <div class="setting-row toggle-row">
              <span class="setting-label">显示上一步路径</span>
              <button type="button" class="toggle" id="opt-lastmove"><img src="texture/toggleoff.png" alt="off"></button>
            </div>
            <div class="setting-row toggle-row">
              <span class="setting-label">显示行列坐标</span>
              <button type="button" class="toggle" id="opt-coords"><img src="texture/toggleoff.png" alt="off"></button>
            </div>
          <div class="setting-row toggle-row">
            <span class="setting-label" id="opt-oppmoves-label">显示对方选子</span>
            <button type="button" class="toggle" id="opt-oppmoves"><img src="texture/toggleoff.png" alt="off"></button>
          </div>
          <div class="setting-row toggle-row">
            <span class="setting-label">显示子力分领先</span>
            <button type="button" class="toggle" id="opt-material"><img src="texture/toggleoff.png" alt="off"></button>
          </div>
          <div class="setting-row nickname-row">
            <span class="setting-label">昵称</span>
            <input id="game-nickname" class="profile-input" type="text" maxlength="20" placeholder="Player">
          </div>
          </div>
          <div class="settings-scrollbar" id="settings-scrollbar">
            <div class="settings-scrollbar-thumb" id="settings-scrollbar-thumb"></div>
          </div>
        </div>
        <div class="settings-foot">
          <button id="btn-scale-reset" class="btn">恢复默认</button>
          <button id="btn-nickname-save" class="btn">保存昵称</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="js/chess.js"></script>
  <script src="js/net.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
